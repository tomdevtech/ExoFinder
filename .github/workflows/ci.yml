name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:scripts
      - run: npm run build

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # Code that ships to visitors must have no known vulnerability at all.
      - name: Production dependencies
        run: npm audit --omit=dev --audit-level=low
      # Dev tools may have moderate advisories, but high or critical ones fail
      # unless src/deploy/audit.ts accepts them temporarily.
      - run: npm ci
      - name: All dependencies
        run: npm run audit:tools

  db:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: exofinder
          POSTGRES_PASSWORD: exofinder
          POSTGRES_DB: exofinder_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U exofinder -d exofinder_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://exofinder:exofinder@localhost:5432/exofinder_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:db

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: exofinder
          POSTGRES_PASSWORD: exofinder
          POSTGRES_DB: exofinder_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U exofinder -d exofinder_e2e"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      E2E_DATABASE_URL: postgres://exofinder:exofinder@localhost:5432/exofinder_e2e
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The runner is pinned to ubuntu-24.04 because this Playwright version
      # cannot install its browser dependencies on Ubuntu 26.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Kept after a green run too: a test that failed and then passed on its retry counts as flaky, and
      # only its trace can tell a crash of the browser in the runner from a fault of the site. Playwright
      # keeps traces of failed attempts only, so the report of a run without them stays small.
      - name: Keep the report of the run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
