name: Deployment check

# Smoke-tests a Vercel deployment under its own address. deploy.yml calls it for every deployment:
# a preview is only checked, and a production deployment is put live by deploy.yml only when this
# check has passed. A manual run checks any address.
# Setup is in docs/DEPLOYMENT.md. With Deployment Protection it needs the secret
# VERCEL_AUTOMATION_BYPASS_SECRET.

on:
  workflow_call:
    inputs:
      url:
        type: string
        required: true
      environment:
        type: string
        required: true
      sha:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      url:
        description: "Address to check, for example https://exofinder.vercel.app"
        required: true
      environment:
        description: "production or preview (only for the log)"
        default: production
      sha:
        description: "Commit the deployment should run (optional)"
        required: false

permissions:
  contents: read

env:
  DEPLOY_URL: ${{ inputs.url }}
  DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
  DEPLOY_SHA: ${{ inputs.sha }}

# One check per environment at a time; a newer deployment waits for the older check.
concurrency:
  group: deploy-check-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  # This job runs with the bypass secret, also for the preview of a pull request. So it runs the smoke
  # test as it is on main, not the commit's own: a branch could otherwise read the secret in a test or
  # in an install script of a package it adds. CI runs the commit's smoke test against its local build.
  # No npm cache either, because what this run would save counts as main's and every later run reads it.
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Vercel may send the address without https://.
      - name: Address of the deployment
        run: |
          url="${DEPLOY_URL%/}"
          case "$url" in http://*|https://*) ;; *) url="https://$url" ;; esac
          echo "SMOKE_BASE_URL=$url" >> "$GITHUB_ENV"
          echo "SMOKE_EXPECTED_SHA=$DEPLOY_SHA" >> "$GITHUB_ENV"
          echo "Checking $url ($DEPLOY_ENVIRONMENT, commit ${DEPLOY_SHA:-unknown})"
      # A 401/403 is a setup problem (missing bypass secret), not a broken deployment, and is named
      # as one before the browser tests fail on it one by one.
      - name: Can the check reach the deployment?
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "$SMOKE_BASE_URL/health" || true)
          echo "/health answered ${status:-nothing}"
          if [ "$status" = "401" ] || [ "$status" = "403" ]; then
            echo "::error::Vercel's Deployment Protection blocks the check. Set the secret VERCEL_AUTOMATION_BYPASS_SECRET (docs/DEPLOYMENT.md)."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      # The runner is pinned to ubuntu-24.04 because this Playwright version
      # cannot install its browser dependencies on Ubuntu 26.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:smoke
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Keep the report of a failed check
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 14
