name: Deploy

# Deploys a commit to Vercel only once every other check of it has passed: CI, CodeQL and its code
# scanning. Vercel's own Git deployments are switched off in vercel.json, because they start at once
# and do not wait for the checks. A push to main becomes production, a pull request a preview.
#
# A production deployment is built without the domain of the site, so nobody sees it yet.
# deploy-check.yml smoke-tests it under its own address, and only a deployment that passes is put
# live. One that fails never reaches a visitor: the site keeps running the deployment before it.
# Setup is in docs/DEPLOYMENT.md: the secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID.
# The two ids open nothing without the token, but as secrets they stay out of the log, which
# everybody can read in a public repository. Variables of the same names still work.
#
# workflow_run only starts this file as it is on main, so a change to it takes effect after merging.
# It holds the Vercel token, so it deploys only branches of this repository, never those of forks,
# and it does not run the commit's code: the Vercel CLI uploads it and Vercel builds it. Nor does it
# deploy the pull requests of Dependabot: nobody has looked at their packages yet, and a preview would
# run them with the database address. They are checked by CI and go live once merged.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  checks: read
  actions: read

# One deployment per branch at a time; a newer commit waits for the older one instead of breaking it off.
concurrency:
  group: deploy-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build on Vercel (not live yet)
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_repository.full_name == github.repository
      && github.event.workflow_run.actor.login != 'dependabot[bot]'
      && !startsWith(github.event.workflow_run.head_branch, 'dependabot/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      environment: ${{ steps.deploy.outputs.environment }}
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      EVENT: ${{ github.event.workflow_run.event }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # CI has passed, but CodeQL runs in a workflow of its own and may still be busy. Vercel's checks
      # and those of this run are left out; any other check that fails stops the deployment.
      - name: Wait for every other check of the commit
        run: |
          own=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .check_suite_id)
          for attempt in $(seq 1 60); do
            checks=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
              --jq ".check_runs[] | select(.check_suite.id != $own) | select(.name | startswith(\"Vercel\") | not) | [.name, .status, (.conclusion // \"-\")] | @tsv")
            if printf '%s\n' "$checks" | awk -F'\t' '$2 == "completed" && $3 != "success" && $3 != "neutral" && $3 != "skipped"' | grep -q .; then
              printf '%s\n' "$checks"
              echo "::error::A check of $SHA failed, so it is not deployed."
              exit 1
            fi
            if ! printf '%s\n' "$checks" | awk -F'\t' '$2 != "completed"' | grep -q .; then
              printf '%s\n' "$checks"
              echo "Every check of $SHA has passed."
              exit 0
            fi
            sleep 20
          done
          printf '%s\n' "$checks"
          echo "::error::The checks of $SHA did not finish within 20 minutes."
          exit 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Deploy to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::The secret VERCEL_TOKEN is missing (docs/DEPLOYMENT.md)."
            exit 1
          fi
          if [ "$EVENT" = "push" ] && [ "$BRANCH" = "main" ]; then
            environment=production
            # Built for production, but without its domain: the smoke test comes first.
            set -- --prod --skip-domain
          else
            environment=preview
            set --
          fi
          # The CLI starts outside the checkout, so no file of the repository (an .npmrc, say) configures it.
          cd "$RUNNER_TEMP"
          url=$(npx -y vercel@65.9.0 deploy "$GITHUB_WORKSPACE" "$@" --yes --token "$VERCEL_TOKEN")
          echo "Deployed $SHA to $url ($environment)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"

  check:
    needs: deploy
    uses: ./.github/workflows/deploy-check.yml
    with:
      url: ${{ needs.deploy.outputs.url }}
      environment: ${{ needs.deploy.outputs.environment }}
      sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit

  # Runs only when the smoke test has passed: a job is skipped when one it needs failed.
  promote:
    name: Go live
    needs: [deploy, check]
    if: ${{ needs.deploy.outputs.environment == 'production' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      URL: ${{ needs.deploy.outputs.url }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Put the checked deployment live
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || vars.VERCEL_PROJECT_ID }}
        # This asks Vercel's API itself. `vercel promote` first asks which user the token belongs to,
        # and fails with "User not found" for a token that may act for the team but is no user's.
        run: |
          api() { curl -sS --max-time 30 -H "Authorization: Bearer $VERCEL_TOKEN" "$@"; }
          message() { jq -r '.error.message // "no answer that can be read"' 2>/dev/null <<<"$1" || echo "no answer that can be read"; }
          # A personal account has no team to name.
          case "$VERCEL_ORG_ID" in team_*) team="teamId=$VERCEL_ORG_ID" ;; *) team="" ;; esac
          host="${URL#*://}"
          host="${host%%/*}"

          deployment=$(api "https://api.vercel.com/v13/deployments/$host?$team")
          id=$(jq -r '.id // empty' 2>/dev/null <<<"$deployment" || true)
          if [ -z "$id" ]; then
            echo "::error::Vercel does not show the deployment $host: $(message "$deployment")"
            exit 1
          fi

          answer=$(api -X POST -H "Content-Type: application/json" -d '{}' -w '\n%{http_code}' \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/promote/$id?$team")
          status="${answer##*$'\n'}"
          if [ "$status" != "201" ] && [ "$status" != "202" ]; then
            echo "::error::Vercel refused to put $host live (status $status): $(message "${answer%$'\n'*}")"
            exit 1
          fi

          # Vercel moves the domains in the background and notes on the project how that went.
          for attempt in $(seq 1 60); do
            project=$(api "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?rollbackInfo=true&$team" || true)
            job=$(jq -r --arg id "$id" 'select(.lastAliasRequest.toDeploymentId == $id) | .lastAliasRequest.jobStatus // empty' 2>/dev/null <<<"$project" || true)
            case "$job" in
              succeeded)
                echo "Commit $SHA is live."
                exit 0
                ;;
              failed | skipped)
                echo "::error::Vercel did not move the domains to $host (its job says: $job). Look in Vercel which deployment is live."
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "::error::Vercel did not finish moving the domains to $host within 5 minutes."
          exit 1
      - name: Summary
        if: ${{ always() }}
        run: |
          {
            if [ "${{ job.status }}" = "success" ]; then
              echo "## Commit $SHA is live"
              echo ""
              echo "$URL passed its smoke test and now serves the site."
            else
              echo "## The checked deployment could not be put live"
              echo ""
              echo "$URL (commit $SHA) passed its smoke test, but Vercel did not promote it."
              echo "The site still runs the deployment before it. Promote by hand in Vercel:"
              echo "*Deployments → … → Promote* (see docs/DEPLOYMENT.md)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Says in the summary of the run why a commit on main did not go live.
  held-back:
    needs: [deploy, check]
    if: ${{ failure() && needs.deploy.result == 'success' && needs.deploy.outputs.environment == 'production' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      URL: ${{ needs.deploy.outputs.url }}
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Summary
        run: |
          {
            echo "## Commit $SHA did not go live"
            echo ""
            echo "Its deployment $URL failed the smoke test, so it never got the domain of the site."
            echo "Visitors still see the deployment before it. Fix the problem in a pull request;"
            echo "the next commit on main is built, checked and put live the same way."
          } >> "$GITHUB_STEP_SUMMARY"
